  <body>
    <div id="root"></div>

    <!-- שחזור נתיב אחרי מעבר דרך 404.html של GitHub Pages.
         Pages לא יודע לנתב נתיבים של SPA, אז הוא מגיש 404 שמעביר לשורש
         הסביבה עם הנתיב המקורי בשאילתה. כאן מחזירים אותו לכתובת, לפני
         שהראוטר עולה, כדי שהמשתמש לא יראה קפיצה. -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search)
        var path = params.get('p')
        if (!path) return

        params.delete('p')
        var query = params.toString()
        var base = window.location.pathname.replace(/\/?$/, '/')

        window.history.replaceState(
          null,
          '',
          base + path.replace(/^\//, '') + (query ? '?' + query : '') + window.location.hash,
        )
      })()
    </script>

  </body>
